name: Main cache

# Keeps main's NuGet cache warm, so the fallback build (fallback.yml) on a new branch starts
# from it: GitHub lets a branch read only its own caches and main's. Runs after each push to
# main and only restores packages, with the same cache setup as fallback.yml. It runs no tests or
# checks, sets no status, and nothing waits for it.
# The one exception: agent-build ci waits up to 30 minutes for a running one. Every job has a timeout-minutes.
on:
  push:
    branches: [main]
    # Pushes that change only files no build uses (lib.sh pipeline_file) leave the caches as they are.
    paths-ignore: [".agents/**", ".github/workflows/**", "**.md", "docs/**", ".gitignore", ".gitattributes", ".claude/**", ".gitstat/**", "LICENSE*"]

permissions:
  contents: read

concurrency:
  group: main-cache
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-
      - run: dotnet restore IdleTrim.csproj -r win-x64 && dotnet restore tests/Tests.csproj
